:root {
  --bg: #0f172a;
  --c: #1e293b;
  --b: #ffffff1a;
  --t: #f8fafc;
  --m: #94a3b8;
  --a: #e11d48;
  --g: #16a34a;
  --w: #f59e0b;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font: 14px system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--t);
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: 76px;
}

header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  background: var(--c);
  border-bottom: 1px solid var(--b);
}

header span {
  display: flex;
  gap: 6px;
}

main {
  max-width: 720px;
  margin: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  background: var(--c);
  border-top: 1px solid var(--b);
  z-index: 5;
  padding-bottom: env(safe-area-inset-bottom);
}

nav button {
  flex: 1;
  background: none;
  border: 0;
  color: var(--m);
  padding: 8px 0;
  font-size: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
}

nav small {
  font-size: 10px;
}

nav .on {
  color: var(--a);
}

.card {
  background: var(--c);
  border: 1px solid var(--b);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.row {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}

.row select {
  width: auto;
  flex: 1;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  border-radius: 10px;
  border: 1px solid var(--b);
  background: var(--bg);
  color: var(--t);
  min-width: 0;
}

.btn {
  display: block;
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: var(--a);
  color: #fff;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
}

.btn.o {
  background: none;
  border: 1px solid var(--b);
  color: var(--t);
}

.i {
  background: none;
  border: 1px solid var(--b);
  border-radius: 8px;
  padding: 6px 10px;
  color: var(--t);
  cursor: pointer;
}

.bd {
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  background: #64748b33;
}

.ok {
  background: #16a34a33;
  color: var(--g);
}

.er {
  background: #ef444433;
  color: #ef4444;
}

.wn {
  background: #f59e0b33;
  color: var(--w);
}

.pos {
  color: var(--g);
}

.neg {
  color: #ef4444;
}

.mt {
  color: var(--m);
  text-align: center;
  padding: 20px;
}

small {
  color: var(--m);
}

h3 {
  font-size: 22px;
}

.warn {
  background: var(--w);
  color: #000;
  padding: 8px;
  text-align: center;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
}

.md {
  position: fixed;
  inset: 0;
  background: #0009;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  z-index: 20;
}

.md .card {
  width: 100%;
  max-width: 400px;
  max-height: 90vh;
  overflow: auto;
}

#toasts {
  position: fixed;
  bottom: 84px;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  z-index: 30;
  pointer-events: none;
}

.toast {
  background: var(--c);
  border: 1px solid var(--b);
  border-left: 4px solid var(--g);
  padding: 10px 16px;
  border-radius: 10px;
  font-weight: 600;
}

.toast.er {
  border-left-color: #ef4444;
}

.auth {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.auth .card {
  width: 100%;
  max-width: 380px;
  text-align: center;
}

footer {
  text-align: center;
  color: var(--m);
  font-size: 11px;
  padding: 14px;
  line-height: 1.6;
}

a {
  color: var(--a);
  cursor: pointer;
}

button,
input,
select,
a,
label {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

input,
select,
textarea {
  font-size: 16px;
}

.btn {
  min-height: 44px;
}

.i {
  min-height: 40px;
  min-width: 40px;
}

@media (max-height: 480px) {
  nav small {
    display: none;
  }

  nav button {
    padding: 4px 0;
    min-height: 44px;
  }

  body {
    padding-bottom: 56px;
  }
}

@media (min-width: 900px) {
  main {
    max-width: 900px;
  }

  main > .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
